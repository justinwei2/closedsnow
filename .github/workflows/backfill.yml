# Locate + calibrate catalog resorts, one parallel job per region (own runner each), then merge
# and commit data/ + CALIBRATION.md. Sleeps through Open-Meteo rate limits; each job stops
# before GitHub's 6 h limit and its progress is still merged. Nightly run is a no-op once done.
name: backfill
on:
  workflow_dispatch:
    inputs:
      force: { description: "Recalibrate every resort", type: boolean, default: false }
      group: { description: "Region group", type: choice, options: [all, sierra, west, rockies, north], default: all }
  schedule:
    - cron: "41 9 * * *"
permissions:
  contents: write
concurrency:
  group: backfill   # separate from refresh: calibration can run for hours without blocking it
  cancel-in-progress: false
jobs:
  region:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.group && inputs.group != 'all' && format('["{0}"]', inputs.group) || '["sierra","west","rockies","north"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate + calibrate ${{ matrix.group }}
        env:
          SKISITE_CONTACT: ${{ secrets.SKISITE_CONTACT }}
        run: timeout 320m python -u calibrate.py --group ${{ matrix.group }} --out out ${{ inputs.force && '--force' || '' }} || echo "stopped early; progress kept, next run continues"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf-${{ matrix.group }}
          path: out/
          if-no-files-found: ignore
          retention-days: 3

  merge:
    needs: region
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: bf-*
          path: parts
      # merge onto the latest main each attempt (other pushes land while regions run); fail loudly
      - name: Merge and commit
        run: |
          git config user.name "snowforecast-bot"
          git config user.email "snowforecast-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python calibrate.py --merge parts
            git add data CALIBRATION.md
            git diff --cached --quiet && exit 0
            git commit -qm "backfill: locate/calibrate $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q origin HEAD:main && exit 0
            sleep $((i * 15))
          done
          echo "::error::could not push the merged calibration"; exit 1
