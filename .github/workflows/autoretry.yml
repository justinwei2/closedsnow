# Re-run failed jobs of refresh/backfill once, automatically (runner hiccups, API flakes).
# Skipped when the failure is the health check: stale data won't be fixed by a re-run.
name: autoretry
on:
  workflow_run:
    workflows: [refresh, backfill]
    types: [completed]
permissions:
  actions: write
jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          failed=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" --jq '[.jobs[].steps[]? | select(.conclusion=="failure") | .name] | join(", ")')
          echo "failed steps: $failed"
          if [ "$failed" = "Health check" ]; then echo "health check only: not retrying"; exit 0; fi
          sleep 120
          gh run rerun "$RUN" --failed -R "$REPO"
