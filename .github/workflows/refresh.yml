# Hourly check; refresh resorts once a new ECMWF run has landed (it arrives last of the 6-hourly
# models, so the whole model cycle is in), or when data is > 7 h old. ~4 refreshes/day/resort.
# A plan job picks the region groups with due resorts; each runs as its own parallel job (own
# runner), staggered, so an Open-Meteo rate limit in one region doesn't stall the others.
# Forecast JSON lives on a single-commit `data` branch so the repo doesn't grow.
name: refresh
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force: { description: "Refresh every resort now", type: boolean, default: false }
env:
  SKISITE_FORCE: ${{ inputs.force && '1' || '' }}
permissions:
  contents: write
  actions: write   # trigger pages.yml; keep this schedule enabled (GitHub disables idle ones after 60 days)
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ./.github/actions/restore-data
      - id: plan
        run: echo "matrix=$(python update.py --plan | tail -1)" >> "$GITHUB_OUTPUT"

  fetch:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ./.github/actions/restore-data
      - run: sleep ${{ matrix.delay }}
      - name: Update ${{ matrix.group }}
        env:
          SKISITE_CONTACT: ${{ secrets.SKISITE_CONTACT }}
        run: |
          touch /tmp/stamp
          python -u update.py --scheduled --group ${{ matrix.group }} --no-index || echo "::warning::update exited non-zero"
          mkdir -p out && find web/data -name '*.json' -newer /tmp/stamp -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        if: always()   # each resort file is written atomically, so partial progress is valid
        with: { name: "data-${{ matrix.group }}", path: out/, if-no-files-found: ignore, retention-days: 1 }

  publish:
    needs: [plan, fetch]
    if: always() && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ./.github/actions/restore-data
      - uses: actions/download-artifact@v4
        continue-on-error: true   # a run where everything was fresh uploads nothing
        with: { pattern: data-*, path: web/data, merge-multiple: true }
      - name: Rebuild index (refuse if resorts disappeared)
        run: |
          count() { python -c "import json,sys; print(sum(1 for r in json.load(open(sys.argv[1]))['resorts'] if r.get('updated')))" "$1" 2>/dev/null || echo 0; }
          before=$(count web/data/index.json)
          python -c "import update; update.write_index()"
          after=$(count web/data/index.json)
          echo "resorts with data: $before -> $after"
          [ "$after" -ge "$before" ] || [ "$(python -c "import resorts; print(len(resorts.CATALOG))")" -lt "$before" ] \
            || { echo "::error::resort count dropped; not publishing"; exit 1; }
      - name: Save data   # force-push one commit: the repo doesn't grow with every refresh
        run: |
          tmp=$(mktemp -d); mkdir -p "$tmp/web"; cp -r web/data "$tmp/web/"
          cd "$tmp" && git init -q -b data && git add -A
          git -c user.name=closedsnow-bot -c user.email=closedsnow-bot@users.noreply.github.com commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data && break
            sleep $((i * 15))
          done
      - name: Deploy (pages.yml)
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY"
      - name: Keep schedule alive
        run: gh workflow enable refresh.yml -R "$GITHUB_REPOSITORY" || true
      - name: Health check   # fails the run (-> GitHub email) on missing/stale data
        run: python update.py --check
