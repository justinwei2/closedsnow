# Redeploy the site right away when the page code changes (the data comes from the `data`
# branch), instead of waiting for the next 3-hourly refresh.
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore data
        run: |
          for i in 1 2 3; do git fetch --depth 1 origin data && git checkout FETCH_HEAD -- web/data && exit 0; sleep $((i * 10)); done
          echo "::error::could not restore data"; exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
