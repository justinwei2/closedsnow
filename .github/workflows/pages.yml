# The only deploy path: page code from main + forecast data from the `data` branch.
# Runs on page changes and after every refresh (refresh.yml triggers it).
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/restore-data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      # GitHub's Pages API flakes now and then: up to 3 attempts
      - { id: d1, uses: actions/deploy-pages@v4, continue-on-error: true }
      - { if: steps.d1.outcome == 'failure', run: sleep 60 }
      - { id: d2, if: steps.d1.outcome == 'failure', uses: actions/deploy-pages@v4, continue-on-error: true }
      - { if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure', run: sleep 120 }
      - { id: d3, if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure', uses: actions/deploy-pages@v4 }
